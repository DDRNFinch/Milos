name: Verify exact Evia avatar replacement

on:
  push:
    branches: [milos-exact-evia-avatar-v278]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: milos-exact-evia-avatar-v278
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply exact current Evia avatar in Milos blue
        shell: bash
        run: |
          cat > assets/milos-evia-avatar-v276.css <<'EOF'
          /* Exact current Evia avatar component, recoloured only to Milos blue. */
          .milos-app .milos-anchor {
            --milos-avatar-blue: #2c85f7;
            --milos-eye-x: 0em;
            --milos-eye-y: 0em;
            --milos-char-tilt: 0deg;
            top: 50%;
            width: 1em;
            height: 1em;
            font-size: clamp(123.75px, 34.5vw, 165px);
            transition:
              top 1100ms cubic-bezier(0.22, 1, 0.36, 1),
              font-size 1100ms cubic-bezier(0.22, 1, 0.36, 1),
              opacity 0.6s ease,
              transform 1100ms cubic-bezier(0.22, 1, 0.36, 1);
          }

          .milos-app.is-open .milos-anchor {
            top: calc(max(18px, env(safe-area-inset-top)) + 28px);
            width: 1em;
            height: 1em;
            font-size: clamp(61.875px, 17.25vw, 82.5px);
          }

          .milos-app.is-onboarding .milos-anchor {
            top: clamp(5.9rem, 15.5vh, 8rem);
            width: 1em;
            height: 1em;
            font-size: clamp(7rem, 13vw, 8.25rem);
          }

          .milos-app .milos-anchor .evia-float {
            position: relative;
            width: 1em;
            height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: milos-stageFloat 8s ease-in-out infinite;
          }

          .milos-app .milos-anchor .evia-float::before {
            content: "";
            position: absolute;
            inset: 0.10em;
            border-radius: 50%;
            background: radial-gradient(circle at center, rgba(44, 133, 247, 0.22), rgba(44, 133, 247, 0.08) 46%, rgba(44, 133, 247, 0) 76%);
            filter: blur(0.10em);
            transform: scale(1.12);
            animation: milos-glowPulse 8s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
          }

          /* Keep Milos's existing pose hook alive without drawing its old face. */
          .milos-app .milos-anchor #milosFace {
            display: contents !important;
          }

          .milos-app .milos-anchor .evia-character {
            position: relative;
            width: 1em;
            height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
            transform: rotate(var(--milos-char-tilt));
            transition: transform 1400ms cubic-bezier(0.22, 1, 0.36, 1);
            z-index: 1;
            will-change: transform;
          }

          .milos-app .milos-anchor .evia-body {
            position: relative;
            width: 1em;
            height: 1em;
            border: 0.026em solid var(--milos-avatar-blue);
            border-radius: 50%;
            background: transparent;
            display: flex;
            align-items: center;
            justify-content: center;
            filter:
              drop-shadow(0 0 0.038em rgba(44, 133, 247, 0.55))
              drop-shadow(0 0 0.105em rgba(44, 133, 247, 0.28))
              drop-shadow(0 0 0.22em rgba(44, 133, 247, 0.13));
            animation: milos-bodyDrift 10s ease-in-out infinite;
            will-change: transform;
          }

          .milos-app .milos-anchor .eyes {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.105em;
            transform: translate(var(--milos-eye-x), var(--milos-eye-y));
            transition: transform 1200ms cubic-bezier(0.22, 1, 0.36, 1);
            will-change: transform;
          }

          .milos-app .milos-anchor .eye {
            width: 0.235em;
            height: 0.235em;
            border: 0.022em solid var(--milos-avatar-blue);
            border-radius: 50%;
            background: transparent;
            transform-origin: center;
            transition: transform 150ms ease;
            will-change: transform;
            flex: 0 0 auto;
          }

          .milos-app .milos-anchor .evia-character.blink .eye {
            transform: scaleY(0.08);
          }

          .milos-app .milos-anchor .evia-character.accent-wobble {
            animation: milos-accentWobble 1200ms cubic-bezier(0.22, 1, 0.36, 1);
          }

          .milos-app .milos-anchor .evia-character.accent-squish {
            animation: milos-accentSquish 1150ms cubic-bezier(0.22, 1, 0.36, 1);
          }

          .milos-app .milos-anchor .evia-character.accent-lean {
            animation: milos-accentLean 1350ms cubic-bezier(0.22, 1, 0.36, 1);
          }

          /* Preserve Milos's current surrounding layout; avatar only. */
          .milos-app .milos-home-copy {
            top: calc(50% + clamp(88px, 24vw, 108px));
          }

          @keyframes milos-stageFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
          }

          @keyframes milos-glowPulse {
            0%, 100% { transform: scale(1.08); opacity: 0.8; }
            50% { transform: scale(1.16); opacity: 1; }
          }

          @keyframes milos-bodyDrift {
            0%, 100% { transform: rotate(0deg) scale(1); }
            25% { transform: rotate(-0.6deg) scale(1.005, 0.995); }
            50% { transform: rotate(0.4deg) scale(0.995, 1.005); }
            75% { transform: rotate(-0.4deg) scale(1.003, 0.997); }
          }

          @keyframes milos-accentWobble {
            0% { transform: rotate(var(--milos-char-tilt)) scale(1); }
            20% { transform: rotate(calc(var(--milos-char-tilt) - 3deg)) scale(1.01); }
            40% { transform: rotate(calc(var(--milos-char-tilt) + 2.4deg)) scale(1.01); }
            60% { transform: rotate(calc(var(--milos-char-tilt) - 1.5deg)) scale(1.005); }
            80% { transform: rotate(calc(var(--milos-char-tilt) + 0.8deg)) scale(1.002); }
            100% { transform: rotate(var(--milos-char-tilt)) scale(1); }
          }

          @keyframes milos-accentSquish {
            0% { transform: rotate(var(--milos-char-tilt)) scale(1); }
            25% { transform: rotate(calc(var(--milos-char-tilt) - 1deg)) scale(1.05, 0.92); }
            55% { transform: rotate(calc(var(--milos-char-tilt) + 1deg)) scale(0.95, 1.06); }
            100% { transform: rotate(var(--milos-char-tilt)) scale(1); }
          }

          @keyframes milos-accentLean {
            0% { transform: translateX(0) rotate(var(--milos-char-tilt)) scale(1); }
            25% { transform: translateX(-0.02em) rotate(calc(var(--milos-char-tilt) - 2deg)) scale(1.01); }
            60% { transform: translateX(0.01em) rotate(calc(var(--milos-char-tilt) + 1deg)) scale(1.005); }
            100% { transform: translateX(0) rotate(var(--milos-char-tilt)) scale(1); }
          }

          @media (prefers-reduced-motion: reduce) {
            .milos-app .milos-anchor,
            .milos-app .milos-anchor .evia-float,
            .milos-app .milos-anchor .evia-float::before,
            .milos-app .milos-anchor .evia-body,
            .milos-app .milos-anchor .evia-character,
            .milos-app .milos-anchor .eyes,
            .milos-app .milos-anchor .eye {
              animation: none !important;
              transition: none !important;
            }
          }
          EOF

          cat > assets/milos-evia-avatar-v276.js <<'EOF'
          (function (global) {
            "use strict";

            const VERSION = "2.78";
            const looks = [
              { x: 0, y: 0, tilt: 0 },
              { x: -0.038, y: 0, tilt: -1.2 },
              { x: 0.038, y: 0, tilt: 1.2 },
              { x: 0, y: -0.029, tilt: 0 },
              { x: 0, y: 0.029, tilt: 0.3 },
              { x: -0.029, y: -0.019, tilt: -1.6 },
              { x: 0.029, y: -0.019, tilt: 1.6 },
              { x: -0.029, y: 0.019, tilt: -1 },
              { x: 0.029, y: 0.019, tilt: 1 },
            ];
            const accents = ["accent-wobble", "accent-squish", "accent-lean"];

            let accentBusy = false;
            let lastLook = 0;
            let stopped = false;

            function reduced(app) {
              return !!(app && app.classList.contains("is-reduced-motion")) ||
                !!(global.matchMedia && global.matchMedia("(prefers-reduced-motion: reduce)").matches);
            }

            function pickDifferentLook() {
              let next = lastLook;
              while (next === lastLook) next = Math.floor(Math.random() * looks.length);
              lastLook = next;
              return looks[next];
            }

            function init() {
              const app = document.getElementById("milosApp");
              const anchor = app && app.querySelector(".milos-anchor");
              const float = anchor && anchor.querySelector(".evia-float");
              if (!app || !anchor || !float || anchor.dataset.eviaAvatarParity === VERSION) return;
              anchor.dataset.eviaAvatarParity = VERSION;

              /* Current Evia DOM structure. milosFace remains only as Milos's existing pose hook. */
              float.innerHTML = `
                <span id="milosFace" class="evia-face expression-idle" aria-hidden="true">
                  <span class="evia-character" id="milosEviaCharacter">
                    <span class="evia-body">
                      <span class="eyes">
                        <span class="eye"></span>
                        <span class="eye"></span>
                      </span>
                    </span>
                  </span>
                </span>`;

              const character = document.getElementById("milosEviaCharacter");
              if (!character) return;

              function applyLook() {
                if (stopped || reduced(app) || accentBusy || character.classList.contains("talking")) return;
                const look = pickDifferentLook();
                anchor.style.setProperty("--milos-eye-x", `${look.x}em`);
                anchor.style.setProperty("--milos-eye-y", `${look.y}em`);
                anchor.style.setProperty("--milos-char-tilt", `${look.tilt}deg`);
              }

              function blink(doubleBlink = false) {
                if (stopped || reduced(app) || character.classList.contains("talking") || character.classList.contains("blink")) return;
                character.classList.add("blink");
                setTimeout(() => {
                  character.classList.remove("blink");
                  if (doubleBlink) {
                    setTimeout(() => {
                      character.classList.add("blink");
                      setTimeout(() => character.classList.remove("blink"), 130);
                    }, 110);
                  }
                }, 130);
              }

              function runAccent() {
                if (stopped || reduced(app) || accentBusy || app.classList.contains("is-open") || character.classList.contains("talking")) return;
                accentBusy = true;
                const accent = accents[Math.floor(Math.random() * accents.length)];
                character.classList.add(accent);
                const duration = accent === "accent-lean" ? 1350 : accent === "accent-squish" ? 1150 : 1200;
                setTimeout(() => {
                  character.classList.remove(accent);
                  accentBusy = false;
                }, duration + 50);
              }

              function scheduleLooks() {
                if (stopped) return;
                applyLook();
                setTimeout(scheduleLooks, 2800 + Math.random() * 2200);
              }

              function scheduleBlinks() {
                if (stopped) return;
                blink(Math.random() < 0.22);
                setTimeout(scheduleBlinks, 3200 + Math.random() * 2600);
              }

              function scheduleAccents() {
                if (stopped) return;
                runAccent();
                setTimeout(scheduleAccents, 6200 + Math.random() * 2600);
              }

              setTimeout(scheduleLooks, 1800);
              setTimeout(scheduleBlinks, 2200);
              setTimeout(scheduleAccents, 4200);

              global.MilosEviaAvatarParity = Object.freeze({
                version: VERSION,
                blue: "#2C85F7",
                exactCurrentEviaStructure: true,
                stop() { stopped = true; },
                look: applyLook,
                blink,
                accent: runAccent,
              });
            }

            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init, { once: true });
            else init();
          })(window);
          EOF

          python - <<'PY'
          from pathlib import Path
          import json

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          if 'milos-app-version" content="2.77' not in text:
              raise SystemExit('Expected Milos 2.77 index before avatar-only release')
          index.write_text(text.replace('2.77', '2.78'), encoding='utf-8')

          package = Path('package.json')
          data = json.loads(package.read_text(encoding='utf-8'))
          if data.get('version') != '2.77.0':
              raise SystemExit('Expected package 2.77.0 before avatar-only release')
          data['version'] = '2.78.0'
          package.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          sw = Path('sw.js')
          sw_text = sw.read_text(encoding='utf-8')
          if 'milos-assessor-shell-v2.77' not in sw_text:
              raise SystemExit('Expected Milos 2.77 service-worker cache')
          sw_text = sw_text.replace('// Milos 2.77 adds the self-contained Evidence Viewer; assessor workflows remain unchanged',
                                    '// Milos 2.78 replaces only the avatar with the exact current Evia component in Milos blue')
          sw_text = sw_text.replace('milos-assessor-shell-v2.77', 'milos-assessor-shell-v2.78')
          sw.write_text(sw_text, encoding='utf-8')

          Path('update.json').write_text(json.dumps({
              'version': '2.78',
              'title': "Milos now uses Evia's exact current avatar",
              'details': [
                  "Only the Milos avatar has changed",
                  "The avatar now uses the same current structure, proportions, eyes, glow, float, drift, gaze, blink and subtle accent movement as Evia",
                  "Evia yellow is replaced with Milos blue #2C85F7",
                  "The Milos background, header, calendar, menus, evidence viewer and assessor workflows are unchanged"
              ]
          }, indent=2) + '\n', encoding='utf-8')

          Path('tests/milos-evia-avatar-v276.test.mjs').write_text(r'''import test from "node:test";
          import assert from "node:assert/strict";
          import fs from "node:fs";

          const css = fs.readFileSync("assets/milos-evia-avatar-v276.css", "utf8");
          const js = fs.readFileSync("assets/milos-evia-avatar-v276.js", "utf8");
          const index = fs.readFileSync("index.html", "utf8");
          const sw = fs.readFileSync("sw.js", "utf8");

          test("Milos uses the exact current Evia avatar structure in Milos blue", () => {
            assert.match(js, /float\.innerHTML/);
            assert.match(js, /class="evia-character" id="milosEviaCharacter"/);
            assert.match(js, /class="evia-body"/);
            assert.match(js, /class="eyes"/);
            assert.equal((js.match(/class="eye"/g) || []).length, 2);
            assert.match(css, /font-size:\s*clamp\(123\.75px, 34\.5vw, 165px\)/);
            assert.match(css, /font-size:\s*clamp\(61\.875px, 17\.25vw, 82\.5px\)/);
            assert.match(css, /border:\s*0\.026em solid var\(--milos-avatar-blue\)/);
            assert.match(css, /width:\s*0\.235em;/);
            assert.match(css, /height:\s*0\.235em;/);
            assert.match(css, /gap:\s*0\.105em;/);
            assert.match(css, /rgba\(44, 133, 247, 0\.22\)/);
            assert.match(css, /#2c85f7/i);
          });

          test("Milos mirrors current Evia gaze blink and accent behaviour", () => {
            assert.match(js, /x:\s*-0\.038/);
            assert.match(js, /const accents = \["accent-wobble", "accent-squish", "accent-lean"\]/);
            assert.match(js, /2800 \+ Math\.random\(\) \* 2200/);
            assert.match(js, /3200 \+ Math\.random\(\) \* 2600/);
            assert.match(js, /6200 \+ Math\.random\(\) \* 2600/);
            assert.match(js, /Math\.random\(\) < 0\.22/);
            assert.match(js, /setTimeout\(scheduleLooks, 1800\)/);
            assert.match(js, /setTimeout\(scheduleBlinks, 2200\)/);
            assert.match(js, /setTimeout\(scheduleAccents, 4200\)/);
            assert.match(js, /130/);
            assert.match(js, /110/);
            assert.match(css, /25% \{ transform: rotate\(-0\.6deg\) scale\(1\.005, 0\.995\); \}/);
            assert.match(css, /accentWobble/);
            assert.match(css, /accentSquish/);
            assert.match(css, /accentLean/);
          });

          test("avatar-only release is production-loaded and cached", () => {
            assert.match(index, /milos-app-version" content="2\.78"/);
            assert.match(index, /milos-evia-avatar-v276\.css\?v=2\.78/);
            assert.match(index, /milos-evia-avatar-v276\.js\?v=2\.78/);
            assert.match(sw, /milos-assessor-shell-v2\.78/);
            assert.match(sw, /milos-evia-avatar-v276\.css/);
            assert.match(sw, /milos-evia-avatar-v276\.js/);
          });
          ''', encoding='utf-8')
          PY

      - name: Check production JavaScript
        run: npm run check

      - name: Run complete Milos regression suite
        run: npm test

      - name: Verify avatar-only scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          allowed = {
              'assets/milos-evia-avatar-v276.css',
              'assets/milos-evia-avatar-v276.js',
              'index.html',
              'package.json',
              'sw.js',
              'update.json',
              'tests/milos-evia-avatar-v276.test.mjs',
              '.github/workflows/avatar-exact-evia-v278.yml',
          }
          changed = set(subprocess.check_output(['git','status','--short'], text=True).splitlines())
          paths = {line[3:] for line in changed if len(line) > 3}
          extra = paths - allowed
          if extra:
              raise SystemExit('Unexpected files changed: ' + ', '.join(sorted(extra)))
          if not {'assets/milos-evia-avatar-v276.css','assets/milos-evia-avatar-v276.js'} <= paths:
              raise SystemExit('Avatar files were not both changed')
          PY

      - name: Commit verified avatar-only release and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/avatar-exact-evia-v278.yml
          git add assets/milos-evia-avatar-v276.css assets/milos-evia-avatar-v276.js index.html package.json sw.js update.json tests/milos-evia-avatar-v276.test.mjs
          git commit -m "Match Milos avatar exactly to current Evia"
          git push origin HEAD:milos-exact-evia-avatar-v278
