name: Verify Milos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply one-time 2.37 evidence patch
        if: github.event_name == 'push'
        run: python scripts/patch_v237.py
      - name: Check current JavaScript
        run: npm run check
      - name: Run Milos regression tests
        run: npm test
      - name: Verify clean runtime set
        shell: bash
        run: |
          VERSION=$(node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/milos-app-version\" content=\"([^\"]+)/);if(!m)process.exit(1);process.stdout.write(m[1])")
          CONTROLLER=$(node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const m=h.match(/assets\/(milos-evia-course-packs-v\d+\.js)/);if(!m)process.exit(1);process.stdout.write(m[1])")
          for path in \
            assets/milos-auto-trigger-v210.js \
            assets/milos-planning-v212.js \
            assets/milos-natural-narrative-v27.js \
            assets/milos-observation-auto-v25.js \
            assets/milos-observation-prose-v27.js \
            assets/milos-review-auto-v26.js \
            assets/milos-review-prose-v27.js; do
              test ! -e "$path"
          done
          grep -q "milos-app-version\" content=\"${VERSION}" index.html
          grep -q "milos-assessor-shell-v${VERSION}" sw.js
          grep -q "$CONTROLLER" sw.js
          grep -q '/Evia/course-delivery/registry-v1.json' "assets/$CONTROLLER"
          grep -q 'ST0171' "assets/$CONTROLLER"
          ! grep -q 'new MutationObserver(patchMore)' "assets/$CONTROLLER"
          node -e "const fs=require('fs');const h=fs.readFileSync('index.html','utf8');const v=h.match(/milos-app-version\" content=\"([^\"]+)/)[1];const u=JSON.parse(fs.readFileSync('update.json','utf8'));const p=JSON.parse(fs.readFileSync('package.json','utf8'));if(u.version!==v||p.version!==v+'.0')process.exit(1)"
      - name: Verify production asset references
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, sys

          index=Path('index.html').read_text(encoding='utf-8')
          missing=[]
          for raw in re.findall(r'(?:src|href)=["\']([^"\']+)["\']',index):
              path=raw.split('?',1)[0]
              if path.startswith('./'):
                  local=Path(path[2:])
              else:
                  continue
              if not local.exists():
                  missing.append(str(local))
          if missing:
              print('Missing production references:')
              print('\n'.join(sorted(set(missing))))
              sys.exit(1)

          surfaces=[Path('index.html'),Path('sw.js'),Path('package.json')]
          if Path('tests').exists():
              surfaces.extend(p for p in Path('tests').rglob('*') if p.is_file())
          if Path('assets').exists():
              surfaces.extend(p for p in Path('assets').iterdir() if p.is_file())
          text={}
          for p in surfaces:
              try:text[p]=p.read_text(encoding='utf-8',errors='ignore')
              except Exception:text[p]=''

          orphaned=[]
          for asset in sorted(Path('assets').iterdir()):
              if not asset.is_file() or asset.suffix.lower() not in {'.js','.css'}:
                  continue
              name=asset.name
              if not any(p!=asset and name in body for p,body in text.items()):
                  orphaned.append(str(asset))
          if orphaned:
              print('Unreferenced production assets:')
              print('\n'.join(orphaned))
              sys.exit(1)
          PY
      - name: Commit verified 2.37 patch
        if: github.event_name == 'push'
        shell: bash
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo 'No patch changes to commit'
            exit 0
          fi
          git config user.name 'DDRNFinch'
          git config user.email 'dfinch1984@hotmail.co.uk'
          git add -A
          git commit -m 'Fix AC timestamps and seekable observation video'
          git push origin HEAD:main
