name: Verify Milos

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check production JavaScript
        run: npm run check
      - name: Run current Milos regression suite
        run: npm test
      - name: Validate release manifest
        run: python -m json.tool update.json >/dev/null
