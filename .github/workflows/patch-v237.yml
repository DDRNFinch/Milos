# one-time 2.37 repair runner
name: Patch Milos 2.37 evidence access

on:
  push:
    branches: [main]
    paths: ['.github/workflows/patch-v237.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vendor offline WebM duration repair
        shell: bash
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          cd "$TMP"
          ARCHIVE=$(npm pack fix-webm-duration@1.0.6 --silent)
          tar -xzf "$ARCHIVE"
          cd "$GITHUB_WORKSPACE"
          cp "$TMP/package/fix-webm-duration.js" assets/fix-webm-duration-1.0.6.js
          if [ -f "$TMP/package/LICENSE" ]; then
            cp "$TMP/package/LICENSE" third-party-licenses/fix-webm-duration-MIT.txt
          elif [ -f "$TMP/package/LICENSE.md" ]; then
            cp "$TMP/package/LICENSE.md" third-party-licenses/fix-webm-duration-MIT.txt
          else
            printf '%s\n' 'fix-webm-duration 1.0.6 — MIT licensed. Source: https://github.com/yusitnikov/fix-webm-duration' > third-party-licenses/fix-webm-duration-MIT.txt
          fi
      - name: Patch evidence timestamps and seekability
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root=Path('.')
          js=root/'assets/milos-video-evidence-v231.js'
          text=js.read_text(encoding='utf-8')

          def replace_once(old,new,label):
              global text
              if old not in text:
                  raise SystemExit(f'Missing patch target: {label}')
              text=text.replace(old,new,1)

          replace_once('const VERSION = "2.31";', 'const VERSION = "2.37";', 'engine version')

          old_candidates='''    const candidates = apple\n      ? ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp8,opus", "video/webm"]\n      : ["video/webm;codecs=vp8,opus", "video/webm", "video/webm;codecs=vp9,opus", "video/mp4;codecs=h264,aac", "video/mp4"];'''
          new_candidates='''    const candidates = apple\n      ? ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4", "video/webm;codecs=vp8,opus", "video/webm"]\n      : ["video/mp4;codecs=avc1.42E01E,mp4a.40.2", "video/mp4;codecs=h264,aac", "video/mp4", "video/webm;codecs=vp8,opus", "video/webm;codecs=vp9,opus", "video/webm"];'''
          replace_once(old_candidates,new_candidates,'MP4-first recording')

          old_blob='''    const type = recorder.mimeType || (state.chunks[0] && state.chunks[0].type) || "video/webm", blob = new Blob(state.chunks, { type });\n    if (!blob.size) { stopStream(); state.recorder = null; throw new Error("The recording file was empty. Record this section again."); }\n    const ext = extensionForMime(type), filename = recordingName(kind, item, state.recordStartedAt, ext);\n    let file; try { file = new File([blob], filename, { type, lastModified: state.recordStartedAt }); } catch (_) { file = blob; file.name = filename; }\n    const media = await M.putFile(file);\n    const result = { media, filename, mimeType: type, startedAt: state.recordStartedAt, endedAt, durationSeconds: Math.max(1, Math.round((endedAt - state.recordStartedAt) / 1000)) };'''
          new_blob='''    const type = recorder.mimeType || (state.chunks[0] && state.chunks[0].type) || "video/webm";\n    let blob = new Blob(state.chunks, { type });\n    if (!blob.size) { stopStream(); state.recorder = null; throw new Error("The recording file was empty. Record this section again."); }\n    const durationMs = Math.max(1, endedAt - state.recordStartedAt);\n    if (String(type).toLowerCase().includes("webm") && typeof global.ysFixWebmDuration === "function") {\n      try { blob = await global.ysFixWebmDuration(blob, durationMs, { logger: false }); } catch (_) {}\n    }\n    const ext = extensionForMime(type), filename = recordingName(kind, item, state.recordStartedAt, ext);\n    let file; try { file = new File([blob], filename, { type, lastModified: state.recordStartedAt }); } catch (_) { file = blob; file.name = filename; }\n    const media = await M.putFile(file);\n    const result = { media, filename, mimeType: type, startedAt: state.recordStartedAt, endedAt, durationSeconds: Math.max(1, Math.round(durationMs / 1000)) };'''
          replace_once(old_blob,new_blob,'save-time WebM repair')

          old_status='''      const statusLines = acs.map((ac) => `${ac.code} — ${decisionLabel(ac.status)}`);'''
          new_status='''      const statusLines = acs.map((ac) => {\n        const start = offsetLabel(ac.startedOffsetMs);\n        const end = offsetLabel(ac.endedOffsetMs == null ? ac.startedOffsetMs : ac.endedOffsetMs);\n        return `${ac.code} — Video ${start}${end !== start ? `–${end}` : ""} — ${decisionLabel(ac.status)}`;\n      });'''
          replace_once(old_status,new_status,'AC timestamps in PDF')

          export_anchor='''  function downloadBlob(blob, name) { const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); }\n  async function exportRecord(input) {'''
          export_helpers='''  function mediaDurationMs(record, mediaId) {\n    const timelines = [record && record.videoTimeline || [], ...(record && record.witnessEvidence || []).map((item) => item.videoTimeline || [])];\n    const clip = timelines.flat().find((item) => item && item.mediaId === mediaId);\n    if (!clip) return 0;\n    const explicit = Number(clip.durationSeconds || 0) * 1000;\n    if (explicit > 0) return explicit;\n    return Math.max(0, Number(clip.endedAt || 0) - Number(clip.startedAt || 0));\n  }\n  async function seekableEvidenceBlob(blob, record, mediaId) {\n    if (!blob || !String(blob.type || "").toLowerCase().includes("webm") || typeof global.ysFixWebmDuration !== "function") return blob;\n    const durationMs = mediaDurationMs(record, mediaId);\n    if (!durationMs) return blob;\n    try { return await global.ysFixWebmDuration(blob, durationMs, { logger: false }); } catch (_) { return blob; }\n  }\n\n  function downloadBlob(blob, name) { const url = URL.createObjectURL(blob), a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 5000); }\n  async function exportRecord(input) {'''
          replace_once(export_anchor,export_helpers,'export repair helpers')

          old_entry='''        entries.push({ name: clean(item.name || stored.name, 170) || "video", blob: stored.blob, date: new Date(Number(stored.createdAt || item.startedAt || Date.now())) });'''
          new_entry='''        const exportBlob = await seekableEvidenceBlob(stored.blob, record, item.id);\n        entries.push({ name: clean(item.name || stored.name, 170) || "video", blob: exportBlob, date: new Date(Number(stored.createdAt || item.startedAt || Date.now())) });'''
          replace_once(old_entry,new_entry,'export-time existing WebM repair')

          replace_once('stablePreview: true, exportRecord, buildProfessionalPdf','stablePreview: true, seekableMedia: true, acTimestampsInPdf: true, exportRecord, buildProfessionalPdf','capability flags')
          js.write_text(text,encoding='utf-8')

          index=(root/'index.html').read_text(encoding='utf-8')
          index=index.replace('content="2.36"','content="2.37"',1).replace('?v=2.36','?v=2.37')
          needle='  <script defer src="./assets/milos-app.js?v=2.37"></script>\n  <script defer src="./assets/milos-video-evidence-v231.js?v=2.37"></script>'
          replacement='  <script defer src="./assets/milos-app.js?v=2.37"></script>\n  <script defer src="./assets/fix-webm-duration-1.0.6.js?v=2.37"></script>\n  <script defer src="./assets/milos-video-evidence-v231.js?v=2.37"></script>'
          if needle not in index: raise SystemExit('Missing index insertion target')
          (root/'index.html').write_text(index.replace(needle,replacement,1),encoding='utf-8')

          sw=(root/'sw.js').read_text(encoding='utf-8').replace('milos-assessor-shell-v2.36','milos-assessor-shell-v2.37',1)
          needle='  "./assets/milos-app.js",\n  "./assets/milos-video-observation-v226.css",'
          replacement='  "./assets/milos-app.js",\n  "./assets/fix-webm-duration-1.0.6.js",\n  "./assets/milos-video-observation-v226.css",'
          if needle not in sw: raise SystemExit('Missing service worker insertion target')
          (root/'sw.js').write_text(sw.replace(needle,replacement,1),encoding='utf-8')

          pkg=json.loads((root/'package.json').read_text(encoding='utf-8'))
          pkg['version']='2.37.0'
          if 'assets/fix-webm-duration-1.0.6.js' not in pkg['scripts']['check']:
              pkg['scripts']['check']=pkg['scripts']['check'].replace('node --check assets/milos-video-evidence-v231.js','node --check assets/fix-webm-duration-1.0.6.js && node --check assets/milos-video-evidence-v231.js')
          (root/'package.json').write_text(json.dumps(pkg,indent=2)+'\n',encoding='utf-8')

          update={'version':'2.37','title':'Evidence timestamps and seekable video','details':['Every observed AC now shows its exact video start and end timestamp on the professional PDF','New Android recordings prefer MP4 when the device supports it so evidence can be scrubbed and fast-forwarded normally','WebM recordings are repaired without transcoding so duration metadata is present and the progress bar can seek','Existing video observations are repaired when their evidence ZIP is downloaded, so previously recorded evidence does not need to be recorded again','Video quality is unchanged by the seekability repair; Milos only fixes container metadata']}
          (root/'update.json').write_text(json.dumps(update,indent=2)+'\n',encoding='utf-8')

          for p in (root/'tests').glob('*.test.mjs'):
              t=p.read_text(encoding='utf-8').replace('2\\.36','2\\.37').replace('2.36','2.37')
              p.write_text(t,encoding='utf-8')

          (root/'tests/milos-evidence-seek-v237.test.mjs').write_text(r'''import test from 'node:test';
import assert from 'node:assert/strict';
import { readFileSync } from 'node:fs';
const js=readFileSync(new URL('../assets/milos-video-evidence-v231.js',import.meta.url),'utf8');
const index=readFileSync(new URL('../index.html',import.meta.url),'utf8');
const sw=readFileSync(new URL('../sw.js',import.meta.url),'utf8');
test('AC timestamps are printed in the professional evidence PDF',()=>{assert.match(js,/Video \$\{start\}/);assert.match(js,/startedOffsetMs/);assert.match(js,/endedOffsetMs/);assert.match(js,/acTimestampsInPdf: true/);});
test('new recordings prefer MP4 when MediaRecorder supports it',()=>{const base=js.indexOf('const candidates');const mp4=js.indexOf('video/mp4;codecs=avc1.42E01E,mp4a.40.2',base);const webm=js.indexOf('video/webm;codecs=vp8,opus',base);assert.ok(mp4>=0&&webm>=0&&mp4<webm);});
test('WebM is repaired at save and export',()=>{assert.match(js,/ysFixWebmDuration\(blob, durationMs/);assert.match(js,/seekableEvidenceBlob/);assert.match(js,/seekableMedia: true/);assert.doesNotMatch(js,/prepareVideoForExport/);});
test('offline shell contains duration repair library',()=>{assert.match(index,/fix-webm-duration-1\.0\.6\.js\?v=2\.37/);assert.ok(index.indexOf('fix-webm-duration-1.0.6.js')<index.indexOf('milos-video-evidence-v231.js'));assert.match(sw,/fix-webm-duration-1\.0\.6\.js/);assert.match(sw,/milos-assessor-shell-v2\.37/);});
''',encoding='utf-8')
          PY
      - name: Validate patched release
        run: |
          npm run check
          npm test
      - name: Commit Milos 2.37
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'DDRNFinch'
          git config user.email 'dfinch1984@hotmail.co.uk'
          git add assets/fix-webm-duration-1.0.6.js third-party-licenses/fix-webm-duration-MIT.txt assets/milos-video-evidence-v231.js index.html sw.js package.json update.json tests
          git commit -m 'Fix AC timestamps and seekable observation video'
          git push origin HEAD:main
